name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: vectors-x86_64-unknown-linux-gnu.tar.gz
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: vectors-aarch64-unknown-linux-gnu.tar.gz
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: vectors-x86_64-apple-darwin.tar.gz
          - name: macOS Apple silicon
            os: macos-15
            target: aarch64-apple-darwin
            archive: vectors-aarch64-apple-darwin.tar.gz
          - name: Windows x86-64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: vectors-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --all-targets --all-features --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --features gpu --target ${{ matrix.target }}
      - name: Verify Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          target/${{ matrix.target }}/release/vectors --version
          target/${{ matrix.target }}/release/vectors-server --version
      - name: Verify Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/vectors.exe" --version
          & "target/${{ matrix.target }}/release/vectors-server.exe" --version
      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          tar -C target/${{ matrix.target }}/release -czf ${{ matrix.archive }}
          vectors vectors-server
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/vectors.exe", "target/${{ matrix.target }}/release/vectors-server.exe" `
            -DestinationPath "${{ matrix.archive }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify tag, package version, and release notes
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "v$package_version" = "${{ github.ref_name }}"
          heading_prefix="## $package_version - "
          heading_count=$(awk -v prefix="$heading_prefix" '
            index($0, prefix) == 1 && $0 ~ /[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/ { count++ }
            END { print count + 0 }
          ' CHANGELOG.md)
          if [ "$heading_count" -ne 1 ]; then
            echo "CHANGELOG.md must contain exactly one dated section for $package_version" >&2
            exit 1
          fi
          awk -v prefix="$heading_prefix" '
            index($0, prefix) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          grep -Eq '^### (Added|Changed|Deprecated|Removed|Fixed|Security)$' release-notes.md
          grep -Eq '^- ' release-notes.md
      - name: Add installers
        shell: bash
        run: cp install.sh install.ps1 dist/
      - name: Create checksums
        shell: bash
        run: cd dist && sha256sum vectors-* install.sh install.ps1 > SHA256SUMS
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/vectors-*
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --notes-file release-notes.md
          --generate-notes
          --fail-on-no-commits
          --verify-tag

  verify-installers:
    name: Verify installer (${{ matrix.name }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-22.04
          - name: Linux ARM64
            os: ubuntu-22.04-arm
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple silicon
            os: macos-15
          - name: Windows x86-64
            os: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify POSIX installer
        if: runner.os != 'Windows'
        shell: bash
        env:
          VECTORS_VERSION: ${{ github.ref_name }}
          VECTORS_INSTALL_DIR: ${{ runner.temp }}/vectors-bin
          VECTORS_NO_START: 1
        run: |
          chmod +x install.sh
          ./install.sh --no-start --no-open
          "$VECTORS_INSTALL_DIR/vectors" --version
          "$VECTORS_INSTALL_DIR/vectors-server" --version
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./install.ps1 `
            -Version "${{ github.ref_name }}" `
            -InstallDir "$env:RUNNER_TEMP\vectors-bin" `
            -NoStart `
            -NoOpen
          & "$env:RUNNER_TEMP\vectors-bin\vectors.exe" --version
          & "$env:RUNNER_TEMP\vectors-bin\vectors-server.exe" --version
