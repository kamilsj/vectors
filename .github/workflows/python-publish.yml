name: Publish Python SDK

on:
  push:
    tags:
      - "python-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: python-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: uv sync --project python --locked
      - name: Match release tag to SDK version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "python-v$(uv version --project python --short)" = "$RELEASE_TAG"
      - run: uv run --project python --locked python python/tools/generate_async.py --check
      - run: uv run --project python --locked ruff check python
      - run: cargo build --locked --bin vectors-server
      - run: uv run --project python --locked python -m unittest discover -s python/tests -v
        env:
          VECTORS_TEST_SERVER: target/debug/vectors-server
      - run: uv build python --out-dir python/dist --clear --no-sources
      - run: uv run --project python --locked python python/tools/check_dist.py python/dist --install
        env:
          VECTORS_TEST_SERVER: target/debug/vectors-server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.repository == 'kamilsj/vectors'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vectors-sdk/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - name: Publish verified wheel and source distribution
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple dist/*
