name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting, linting, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked

  msrv:
    name: Rust 1.89 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
      - run: cargo check --all-targets --all-features --locked

  installer-contract:
    name: Installer contract (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-22.04
            asset: vectors-x86_64-unknown-linux-gnu.tar.gz
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            asset: vectors-aarch64-unknown-linux-gnu.tar.gz
          - name: macOS Intel
            os: macos-15-intel
            asset: vectors-x86_64-apple-darwin.tar.gz
          - name: macOS Apple silicon
            os: macos-15
            asset: vectors-aarch64-apple-darwin.tar.gz
          - name: Windows x86-64
            os: windows-2025
            asset: vectors-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate POSIX installer without downloading
        if: runner.os != 'Windows'
        shell: bash
        env:
          EXPECTED_ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          sh -n install.sh
          sh install.sh --help >/dev/null
          target=$(sh install.sh --print-target)
          test -n "$target"
          plan=$(sh install.sh --dry-run)
          grep -Fq "$EXPECTED_ASSET" <<<"$plan"
      - name: Validate Windows installer without downloading
        if: runner.os == 'Windows'
        shell: powershell
        env:
          EXPECTED_ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = "Stop"
          [void][scriptblock]::Create((Get-Content -Raw -LiteralPath install.ps1))
          $null = Get-Help ./install.ps1 -Full
          $resolved = (& ./install.ps1 -PrintTarget | Out-String)
          if (-not $resolved.Contains($env:EXPECTED_ASSET)) {
            throw "Expected asset $env:EXPECTED_ASSET; got: $resolved"
          }
          $preview = (& ./install.ps1 -WhatIf 6>&1 | Out-String)
          if ([string]::IsNullOrWhiteSpace($preview)) {
            throw "-WhatIf did not produce an installation plan"
          }

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo test --all-targets --all-features --locked
      - run: cargo build --release --locked --features gpu
      - name: Smoke-test performance harnesses
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --release --locked --features gpu --example benchmark_vector_search -- --compute cpu
          cargo run --release --locked --example benchmark_ingestion
          cargo run --release --locked --example benchmark_storage
        env:
          VECTORS_BENCH_ROWS: 2000
          VECTORS_BENCH_DIMENSIONS: 32
          VECTORS_BENCH_ITERATIONS: 2
          VECTORS_BENCH_EXISTING_ROWS: 2000
