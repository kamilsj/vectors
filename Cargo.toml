[package]
name = "vectors"
version = "0.6.0"
edition = "2021"
rust-version = "1.89"
description = "An embeddable SQL engine for relational data and vector similarity search"
readme = "README.md"
repository = "https://github.com/kamilsj/vectors"
homepage = "https://github.com/kamilsj/vectors"
documentation = "https://docs.rs/vectors"
keywords = ["database", "sql", "vector", "embeddings", "search"]
categories = ["database-implementations"]

[features]
default = []
gpu = ["dep:bytemuck", "dep:pollster", "dep:wgpu"]

[dependencies]
actix-web = "4.14.0"
bytemuck = { version = "1.25.0", optional = true, features = ["derive"] }
pollster = { version = "0.4.0", optional = true }
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlparser = "0.43.0"
thiserror = "2.0"
wgpu = { version = "29.0.3", optional = true, default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "metal", "wgsl"] }

[lints.rust]
unsafe_code = "forbid"
