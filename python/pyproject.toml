[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectors-sdk"
version = "0.1.0"
description = "Python client for the Vectors SQL, vector search, and GraphRAG database"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
keywords = ["vector-database", "sql", "rag", "graph", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/kamilsj/vectors"
Documentation = "https://github.com/kamilsj/vectors/blob/main/python/README.md"
Issues = "https://github.com/kamilsj/vectors/issues"

[dependency-groups]
dev = ["packaging>=24,<27", "ruff>=0.15.1,<0.17", "twine>=6.2,<8"]

[tool.uv]
required-version = ">=0.12.10"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
publish-url = "https://upload.pypi.org/legacy/"
default = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vectors_sdk = ["py.typed"]
